[package]
name = "lenso-auth-password-module"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "Password registration and login Module for Lenso vNext."

[package.metadata.lenso]
package-id = "lenso.auth.password"

[dependencies]
lenso = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "48cf37b6475a0dbbe4ad8492888ed7c6c17abae4" }
argon2.workspace = true
getrandom.workspace = true
lenso-capability-credential-issuer = { path = "../lenso-capability-credential-issuer", version = "0.1.0" }
lenso-capability-identity-directory = { path = "../lenso-capability-identity-directory", version = "0.1.0" }
lenso-capability-password-auth = { path = "../lenso-capability-password-auth", version = "0.1.0" }
lenso-capability-secrets = { git = "https://github.com/LioRael/lenso-secrets-module", rev = "687f1abc28adf052607010a4f5f100f6208bf454" }
lenso-kernel = "0.1.9"
lenso-native-adapter = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "48cf37b6475a0dbbe4ad8492888ed7c6c17abae4" }
lenso-postgres-kit = { git = "https://github.com/LioRael/lenso-postgres-kit", rev = "525c1012c789e6f54c3c2fdaf8507a626c93e65f" }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
zeroize.workspace = true

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt"] }

[lints]
workspace = true
