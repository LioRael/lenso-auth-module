[package]
name="lenso-auth-oidc-module"
version="0.1.0"
edition.workspace=true
license.workspace=true
publish=false
repository.workspace=true
[package.metadata.lenso]
package-id = "lenso.auth.oidc"

[dependencies]
lenso = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "48cf37b6475a0dbbe4ad8492888ed7c6c17abae4" }
