[package]
name = "lenso-auth-api-token-module"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "PostgreSQL-backed opaque API token Auth Module for Lenso vNext."

[package.metadata.lenso]
package-id = "lenso.auth.api-token"

[dependencies]
lenso = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "1a835b8a213d24635171297160f3b534e5602cce" }
base64.workspace = true
futures.workspace = true
getrandom.workspace = true
hmac.workspace = true
lenso-auth-sdk = { path = "../lenso-auth-sdk", version = "0.2.0" }
lenso-capability-auth = { path = "../lenso-capability-auth", version = "0.1.1" }
lenso-capability-secrets = { git = "https://github.com/LioRael/lenso-secrets-module", rev = "e1cd46dd7156241f05ad5eeebbae995831c07da6" }
lenso-kernel = "0.1.9"
lenso-native-adapter = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "1a835b8a213d24635171297160f3b534e5602cce" }
lenso-postgres-kit = { git = "https://github.com/LioRael/lenso-postgres-kit", rev = "525c1012c789e6f54c3c2fdaf8507a626c93e65f" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
zeroize.workspace = true

[dev-dependencies]
lenso-app-plan = "0.1.4"
lenso-runner = { git = "https://github.com/LioRael/lenso-runtime-rust.git", rev = "1a835b8a213d24635171297160f3b534e5602cce" }
tokio = { version = "1.52", features = ["macros", "rt"] }

[lints]
workspace = true
