[package]
name = "lenso-auth-api-token-module"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "PostgreSQL-backed opaque API token Auth Module for Lenso vNext."

[dependencies]
base64.workspace = true
futures.workspace = true
getrandom.workspace = true
hmac.workspace = true
lenso-auth-sdk = { path = "../lenso-auth-sdk", version = "0.2.0" }
lenso-capability-auth = { path = "../lenso-capability-auth", version = "0.1.1" }
lenso-capability-secrets = { git = "https://github.com/LioRael/lenso-secrets-module", rev = "be02927a185ebdbb463038ba79d8c6ebbea771f1" }
lenso-kernel = "0.1.1"
lenso-native-adapter = "0.1.1"
lenso-postgres-kit = { git = "https://github.com/LioRael/lenso-postgres-kit", rev = "9cf14997a194c0d6c77d7735ce9f34adc71dd5f4" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
zeroize.workspace = true

[dev-dependencies]
lenso-app-plan = "0.1.0"
lenso-runner = "0.1.1"
tokio = { version = "1.52", features = ["macros", "rt"] }

[lints]
workspace = true
