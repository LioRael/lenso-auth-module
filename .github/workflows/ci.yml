name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LENSO_POSTGRES_TEST_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt,clippy
          targets: wasm32-unknown-unknown,wasm32-wasip2
      - name: Check repository ownership
        run: ./scripts/check-repository-boundary.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets
      - name: Test workspace
        run: cargo test --locked --workspace -- --include-ignored --test-threads=1
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Check portable targets
        run: |
          cargo check --locked -p lenso-capability-auth -p lenso-auth-sdk --target wasm32-unknown-unknown
          cargo check --locked -p lenso-capability-auth -p lenso-auth-sdk --target wasm32-wasip2
      - name: Package public crates
        run: |
          cargo package --locked -p lenso-capability-auth
          cargo package --locked -p lenso-auth-sdk
