name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt
          targets: wasm32-unknown-unknown,wasm32-wasip2
      - name: Check repository ownership
        run: ./scripts/check-repository-boundary.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: Check portable targets
        run: |
          cargo check --locked --workspace --target wasm32-unknown-unknown
          cargo check --locked --workspace --target wasm32-wasip2
      - name: Package public crates
        run: |
          cargo package --locked -p lenso-capability-auth
          cargo package --locked -p lenso-auth-sdk
