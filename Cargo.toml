[workspace]
resolver = "2"
members = [
    "crates/lenso-auth-account-plugin",
    "crates/lenso-auth-anonymous-plugin",
    "crates/lenso-auth-api-token-plugin",
    "crates/lenso-auth-device-plugin",
    "crates/lenso-auth-federated-plugin",
    "crates/lenso-auth-oauth-flow-plugin",
    "crates/lenso-auth-oidc-plugin",
    "crates/lenso-auth-password-plugin",
    "crates/lenso-auth-phone-plugin",
    "crates/lenso-auth-router-plugin",
    "crates/lenso-auth-sdk",
    "crates/lenso-capability-auth",
    "crates/lenso-capability-account-admin",
    "crates/lenso-capability-anonymous-auth",
    "crates/lenso-capability-credential-issuer",
    "crates/lenso-capability-identity-directory",
    "crates/lenso-capability-device-auth",
    "crates/lenso-capability-federated-auth",
    "crates/lenso-capability-oauth-flow",
    "crates/lenso-capability-oidc-provider",
    "crates/lenso-capability-password-auth",
    "crates/lenso-capability-phone-auth",
    "crates/lenso-capability-sms-delivery",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/LioRael/lenso-auth-plugin"
rust-version = "1.94"

[workspace.dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
ed25519-dalek = "3.0"
futures = "0.3"
getrandom = "0.4"
hmac = "0.12"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
lenso = { version = "0.5.0", git = "https://github.com/LioRael/lenso-runtime-rust", rev = "b763a63adc20f1ccc9955e784c0d04c21489126b" }
lenso-app-plan = { version = "0.3.0", git = "https://github.com/LioRael/lenso", rev = "cd35675a191d815b690c8889756dfe859a0e4d7b" }
lenso-capability-http-client = { version = "0.2.2", git = "https://github.com/LioRael/lenso-web", rev = "aa391d21640faf951c0b31504686646f788b5a85" }
lenso-capability-secrets = { version = "0.1.1", git = "https://github.com/LioRael/lenso-secrets-plugin", rev = "c31aa142ff59b4536e2bf3e9785ccbb5bb5c0e6a" }
lenso-contract-authoring = { version = "0.1.1", git = "https://github.com/LioRael/lenso-protocols", rev = "9769bc5dc828fd9111da6d28a4ecd5f1bb198ab4" }
lenso-contract-codegen = { version = "0.6.3", git = "https://github.com/LioRael/lenso-protocols", rev = "9769bc5dc828fd9111da6d28a4ecd5f1bb198ab4" }
lenso-contract-runtime = { version = "0.1.3", git = "https://github.com/LioRael/lenso-protocols", rev = "9769bc5dc828fd9111da6d28a4ecd5f1bb198ab4" }
lenso-kernel = { version = "0.2.0", git = "https://github.com/LioRael/lenso", rev = "cd35675a191d815b690c8889756dfe859a0e4d7b" }
lenso-native-adapter = { version = "0.3.0", git = "https://github.com/LioRael/lenso-runtime-rust", rev = "b763a63adc20f1ccc9955e784c0d04c21489126b" }
lenso-plugin-authoring = { version = "0.1.1", git = "https://github.com/LioRael/lenso-protocols", rev = "9769bc5dc828fd9111da6d28a4ecd5f1bb198ab4" }
lenso-runner = { version = "0.2.0", git = "https://github.com/LioRael/lenso-runtime-rust", rev = "b763a63adc20f1ccc9955e784c0d04c21489126b" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "json", "time"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
url = "2.5"
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
