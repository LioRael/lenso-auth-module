[workspace]
resolver = "2"
members = [
    "crates/lenso-auth-account-plugin",
    "crates/lenso-auth-anonymous-plugin",
    "crates/lenso-auth-api-token-plugin",
    "crates/lenso-auth-device-plugin",
    "crates/lenso-auth-federated-plugin",
    "crates/lenso-auth-oauth-flow-plugin",
    "crates/lenso-auth-oidc-client-plugin",
    "crates/lenso-auth-oidc-plugin",
    "crates/lenso-auth-password-plugin",
    "crates/lenso-auth-phone-plugin",
    "crates/lenso-auth-router-plugin",
    "crates/lenso-auth-sdk",
    "crates/lenso-auth-web-session-plugin",
    "crates/lenso-capability-auth",
    "crates/lenso-capability-account-admin",
    "crates/lenso-capability-anonymous-auth",
    "crates/lenso-capability-credential-issuer",
    "crates/lenso-capability-identity-directory",
    "crates/lenso-capability-device-auth",
    "crates/lenso-capability-federated-auth",
    "crates/lenso-capability-oauth-flow",
    "crates/lenso-capability-oidc-provider",
    "crates/lenso-capability-password-auth",
    "crates/lenso-capability-phone-auth",
    "crates/lenso-capability-sms-delivery",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/LioRael/lenso-auth-plugin"
rust-version = "1.94"

[workspace.dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
ed25519-dalek = "3.0"
futures = "0.3"
getrandom = "0.4"
hmac = "0.12"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
lenso = { version = "0.5.0", git = "https://github.com/LioRael/lenso-runtime-rust", rev = "89815107385475c8b5be378bdcf5e21aa74e02f0" }
lenso-app-plan = { version = "0.3.0", git = "https://github.com/LioRael/lenso", rev = "8599db7e4a214ed92f32089f81d14c833d4becf6" }
lenso-capability-http-client = { version = "0.2.3", git = "https://github.com/LioRael/lenso-web", rev = "5c20e13278c49d6ddcd7bf3cfd2a1dc83c69b320" }
lenso-capability-http-endpoint = { version = "0.2.7", git = "https://github.com/LioRael/lenso-web", rev = "5c20e13278c49d6ddcd7bf3cfd2a1dc83c69b320" }
lenso-capability-secrets = { version = "0.1.2", git = "https://github.com/LioRael/lenso-secrets-plugin", rev = "967fa0d2908b58c24a4b1ad26103a3d9173bbac0" }
lenso-contract-authoring = { version = "0.1.1", git = "https://github.com/LioRael/lenso-protocols", rev = "9d2774c767fd64a6cc63a5ac04360e9cb92816da" }
lenso-contract-codegen = { version = "0.6.4", git = "https://github.com/LioRael/lenso-protocols", rev = "9d2774c767fd64a6cc63a5ac04360e9cb92816da" }
lenso-contract-runtime = { version = "0.1.3", git = "https://github.com/LioRael/lenso-protocols", rev = "9d2774c767fd64a6cc63a5ac04360e9cb92816da" }
lenso-kernel = { version = "0.2.0", git = "https://github.com/LioRael/lenso", rev = "8599db7e4a214ed92f32089f81d14c833d4becf6" }
lenso-native-adapter = { version = "0.3.0", git = "https://github.com/LioRael/lenso-runtime-rust", rev = "89815107385475c8b5be378bdcf5e21aa74e02f0" }
lenso-plugin-authoring = { version = "0.1.1", git = "https://github.com/LioRael/lenso-protocols", rev = "9d2774c767fd64a6cc63a5ac04360e9cb92816da" }
lenso-postgres-kit = { version = "0.1.0", git = "https://github.com/LioRael/lenso-postgres-kit", rev = "97ff73638d1fca098034c443539d44d95062eea4" }
lenso-runner = { version = "0.2.0", git = "https://github.com/LioRael/lenso-runtime-rust", rev = "89815107385475c8b5be378bdcf5e21aa74e02f0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "json", "time"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
url = "2.5"
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
